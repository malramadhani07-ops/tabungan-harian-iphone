<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tabungan Rp20.000</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#171717}
.container{max-width:520px;margin:auto;padding:22px 16px 40px}
h1{font-size:28px;margin:4px 0 6px}
.sub{color:#666;margin:0 0 18px}
.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#f7f7f8;border-radius:14px;padding:14px}
.label{font-size:13px;color:#777}.value{font-size:21px;font-weight:700;margin-top:4px}
.progress{height:12px;background:#e8e8eb;border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar{height:100%;width:0%;background:#111;border-radius:99px;transition:.25s}
.progress-text{font-size:13px;color:#666}
.day{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eee}
.day:last-child{border-bottom:0}
.day input{width:23px;height:23px;accent-color:#111}
.date{font-weight:650;flex:1}.amount{color:#555;font-size:14px}
.done .date{text-decoration:line-through;color:#999}
button{width:100%;border:0;border-radius:13px;padding:13px;font-size:15px;font-weight:650;background:#111;color:#fff}
.note{font-size:12px;color:#777;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="container">
  <h1>💰 Tabungan Harian</h1>
  <p class="sub">Rp20.000 setiap Senin–Jumat • September 2026</p>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="label">Terkumpul</div><div class="value" id="total">Rp0</div></div>
      <div class="stat"><div class="label">Target</div><div class="value">Rp440.000</div></div>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="progress-text" id="progressText">0 dari 22 hari • 0%</div>
  </div>

  <div class="card" id="list"></div>

  <div class="card">
    <button onclick="resetAll()">Reset semua centang</button>
    <div class="note">Centangan tersimpan otomatis di browser Safari kamu.</div>
  </div>
</div>

<script>
const days = [
"1 September","2 September","3 September","4 September",
"7 September","8 September","9 September","10 September","11 September",
"14 September","15 September","16 September","17 September","18 September",
"21 September","22 September","23 September","24 September","25 September",
"28 September","29 September","30 September"
];
const KEY="tabungan-september-2026";
let saved=JSON.parse(localStorage.getItem(KEY)||"[]");

function rupiah(n){return "Rp"+n.toLocaleString("id-ID")}
function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  days.forEach((d,i)=>{
    const row=document.createElement("label");
    row.className="day"+(saved[i]?" done":"");
    row.innerHTML=`<input type="checkbox" ${saved[i]?"checked":""}>
      <span class="date">${d}</span><span class="amount">Rp20.000</span>`;
    row.querySelector("input").addEventListener("change",e=>{
      saved[i]=e.target.checked;
      localStorage.setItem(KEY,JSON.stringify(saved));
      render();
    });
    list.appendChild(row);
  });
  const count=saved.filter(Boolean).length, total=count*20000, pct=Math.round(count/days.length*100);
  document.getElementById("total").textContent=rupiah(total);
  document.getElementById("bar").style.width=pct+"%";
  document.getElementById("progressText").textContent=`${count} dari ${days.length} hari • ${pct}%`;
}
function resetAll(){
  if(confirm("Hapus semua centangan?")){
    saved=[];localStorage.removeItem(KEY);render();
  }
}
render();
</script>
</body>
</html>
